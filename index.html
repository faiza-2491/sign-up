<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "style.css">
    <title>Sign-Up</title>
</head>
<body>
    <div class = "left-image-container">
        <img src = "leaves.jpg">
        <div class = "logo-container">
            <img src = "odin-logo.png">
            <p class = "service-name">Odin</p>
        </div>
    </div>

    <div class = "right-form-container">
        <div class = "head-container">
            <h2>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started. </h2>
            <h2>You know you want to.</h2>
        </div>

        <form action = "" method = "post">

            <fieldset class = "user-info">
                <legend>Let's do this!</legend>

                <section class = "form-name">
                    <p class = "input">
                        <label for = "first-name">FIRST NAME</label>
                        <input type = "text" id = "first-name" name = "first-name" minlength="1" required>
                    </p>
                    <p class = "input">
                        <label for = "last-name">LAST NAME</label>
                        <input type = "text" id = "last-name" name = "last-name" minlength="1" required>
                    </p>
                </section>

                <section class = "form-contact">
                    <p class = "input">
                        <label for = "email">EMAIL</label>
                        <input type = "email" id = "email" name = "email" required>
                    </p>
                    <p class = "input">
                        <label for = "p-number">PHONE NUMBER</label>
                        <input type = "tel" id = "p-number" name = "p-number" required>
                    </p>
                </section>

                <section class = "form-password">
                    <p class = "input">
                        <label for = "password">PASSWORD</label>
                        <input type = "password" id = "password" name = "password" required>
                    </p>
                    <p class = "input">
                        <label for = "confirm-pass">CONFIRM PASSWORD</label>
                        <input type = "password" id = "confirm-pass" name = "confirm-pass" required>
                    </p>
                </section>
            </fieldset>

            <button type = "submit">Create Account</button>
        </form>
        <p class = "log-in">Already have an account? <a href = "">Log In</a></p>

    </div>
</body>
</html>
